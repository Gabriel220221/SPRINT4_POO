spring.application.name=motiva

# Oracle FIAP - credenciais SOMENTE via variáveis de ambiente (nunca no código)
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=${DB_USER:SEU_RM}
spring.datasource.password=${DB_PASSWORD:SUA_SENHA}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool (HikariCP, gerenciado pelo Spring)
spring.datasource.hikari.maximum-pool-size=5

# Reaproveita as tabelas da Sprint 3: o Hibernate NÃO altera o schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
